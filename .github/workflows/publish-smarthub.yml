name: Publish SmartHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: SmartHub version without leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out tagged SmartHub source
        uses: actions/checkout@v4
        with:
          repository: ehive-dev/smarthub
          ref: v${{ inputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev python3 python3-dev

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and USB configuration
        run: |
          node --check src/usbConfig.js
          node --check src/api.js
          node --check updater-app/app.js
          npm run test:wifi
          npm run test:label-printer
          npm run test:evcc-filter-proxy
          node - <<'NODE'
          const assert = require('assert');
          const usb = require('./src/usbConfig');
          const source = {
            version: 1,
            device: { serial: 'TEST', hostname: 'eHiveOne' },
            network: { apply: false, interface: 'eth0', mode: 'static', address: '192.168.1.10', prefix: 24, gateway: '192.168.1.1', dns: ['192.168.1.1'] },
            logging: { enabled: true, mode: 'continuous', maxSizeMb: 100 },
            backup: { apply: false, enabled: true, interval: 'weekly', weekday: 'Sun', time: '03:15' },
          };
          const rendered = usb.renderConfig(source);
          assert.deepStrictEqual(usb.parseConfig(rendered), source);
          assert(rendered.includes('# DE:') && rendered.includes('# EN:'));
          NODE

      - name: Build ARM64 binaries and Debian package
        env:
          VERSION: ${{ inputs.version }}
        run: printf '4\n0\n' | bash scripts/build.sh

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION}"
          notes="SmartHub ${VERSION}\n\n- USB initial configuration via EHIVE or EHIVE_BACKUP\n- Commented bilingual CONF file\n- Network import/export and LED feedback\n- USB diagnostic logging\n- Configurable automatic USB backups"
          gh release create "$tag" \
            "dist/smarthub_${VERSION}_arm64.deb" \
            dist/smarthub \
            dist/smarthub-updater \
            dist/evcc-filter-proxy \
            dist/fan-control-helper \
            --title "SmartHub ${VERSION}" \
            --notes "$notes" \
            --latest
